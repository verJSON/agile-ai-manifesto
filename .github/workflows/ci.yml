# Generated by scripts/gen-node-ci-caller.py --levels "ci-levels.json" -- do not edit; its pin is the `uses:` lines.
name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  ci:
    if: ${{ !github.event.pull_request.draft && (github.event_name == 'pull_request') }}
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@635aca975b1aa93660138875ba9616b27693476f
    with:
      ci-level-id: "ci"
      ci-level-fail-fast: true
      node-version: "24.22.2"
      approved-internal-packages: "@verjson/consent"
      secretless-ci-script-plan: "[\"build\", \"test\", \"test:e2e:ci\"]"
      secretless-pr: true
      secretless-rebuild-packages: "esbuild\nworkerd"
      browser-cache: true
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  trusted:
    if: ${{ !github.event.pull_request.draft && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@635aca975b1aa93660138875ba9616b27693476f
    with:
      ci-level-id: "trusted"
      ci-level-fail-fast: true
      node-version: "24.22.2"
      approved-internal-packages: "@verjson/consent"
      secretless-ci-script-plan: "[\"build\", \"test\", \"test:e2e:ci\"]"
      secretless-trusted-ref: true
      secretless-rebuild-packages: "esbuild\nworkerd"
      browser-cache: true
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  test-levels:
    if: ${{ !github.event.pull_request.draft && (always()) }}
    needs: [ci, trusted]
    permissions: {}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every expected level to succeed
        env:
          LEVEL_COUNT: 2
          LEVEL_0: ci
          RESULT_0: ${{ needs.ci.result }}
          EXPECTED_0: ${{ github.event_name == 'pull_request' }}
          LEVEL_1: trusted
          RESULT_1: ${{ needs.trusted.result }}
          EXPECTED_1: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          failed=0
          for ((i = 0; i < LEVEL_COUNT; i++)); do
            id_name="LEVEL_${i}"
            result_name="RESULT_${i}"
            expected_name="EXPECTED_${i}"
            id="${!id_name}"
            result="${!result_name:-}"
            expected="${!expected_name:-}"
            case "${expected}:${result}" in
              true:success | false:skipped) ;;
              *)
                printf '::error::level %s: expected=%s result=%s\n' "${id}" "${expected}" "${result}"
                failed=1
                ;;
            esac
          done
          exit "${failed}"
